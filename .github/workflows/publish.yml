name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python3 -c "import json; print(json.load(open('custom_components/engie/manifest.json'))['version'])")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag v${TAG} does not match manifest.json version ${PKG}" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
